<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>MedRecall</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@600;700&display=swap">
<style>
/* Layout: one column. Top bar with name and streak, three tabs (Today / Mistakes / Cards), review screen replaces the tabs while open. */
:root {
  --bg: #f4f6fa;
  --surface: #ffffff;
  --fg: #151b2c;
  --muted: #5d6680;
  --line: #dce1ec;
  --accent: #3b5bdb;
  --accent-fg: #ffffff;
  --accent-soft: #e6ebff;
  --streak: #d9480f;
  --good: #2b8a3e;
  --bad: #c92a2a;
  --font-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1220; --surface: #171d30; --fg: #e8ecf8; --muted: #98a2c0; --line: #2a3250;
    --accent: #7c93ff; --accent-fg: #0e1220; --accent-soft: #232c52; --streak: #ff8a4c;
    --good: #69db7c; --bad: #ff8787; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1220; --surface: #171d30; --fg: #e8ecf8; --muted: #98a2c0; --line: #2a3250;
  --accent: #7c93ff; --accent-fg: #0e1220; --accent-soft: #232c52; --streak: #ff8a4c;
  --good: #69db7c; --bad: #ff8787; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding-block: 24px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1 { font-size: 1.6rem; }
h2 { font-size: 1.05rem; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.streak { color: var(--streak); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tabs { display: flex; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.tab { flex: 1; background: transparent; color: var(--muted); border: 0; border-radius: 8px; padding: 9px 6px; font-weight: 500; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-fg); }
button { font: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.muted { color: var(--muted); font-size: 0.9rem; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn { background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.good { background: var(--good); color: var(--bg); }
.btn.bad { background: var(--bad); color: var(--bg); }
.btn[disabled] { opacity: 0.5; cursor: default; }
input[type="text"], input[type="email"], input[type="password"], textarea, select {
  font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 12px; width: 100%; min-width: 0;
}
textarea { resize: vertical; min-height: 96px; }
label.f { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: var(--muted); }
.timer { font-family: var(--font-display); font-size: 3.2rem; font-variant-numeric: tabular-nums; text-align: center; line-height: 1.1; }
.dur { display: flex; gap: 6px; justify-content: center; }
.chip { background: transparent; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 5px 14px; font-size: 0.9rem; }
.chip[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; }
.bar { display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; height: 100%; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.bar i { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 3px; opacity: 0.85; }
.bar.today i { opacity: 1; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.stat { background: var(--accent-soft); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.stat b { font-family: var(--font-display); font-size: 1.6rem; font-variant-numeric: tabular-nums; }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.item { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: var(--surface); }
.item .body { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.tag { display: inline-block; font-size: 0.75rem; background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 1px 10px; margin-right: 6px; }
.due-now { color: var(--streak); font-weight: 600; font-size: 0.8rem; }
.del { background: transparent; border: 0; color: var(--muted); font-size: 1.3rem; line-height: 1; padding: 2px 8px; border-radius: 6px; }
.del:hover { color: var(--bad); }
.q { font-size: 1.2rem; font-weight: 500; overflow-wrap: anywhere; white-space: pre-wrap; }
.ans { border-top: 1px dashed var(--line); padding-top: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg { color: var(--good); font-size: 0.9rem; min-height: 1.3em; }
.empty { color: var(--muted); text-align: center; padding: 18px 0; }
.link { background: transparent; border: 0; color: var(--accent); padding: 0; text-decoration: underline; font-size: 0.85rem; }
</style>
</head>
<body>

<main>
  <div class="top">
    <h1>MedRecall</h1>
    <span class="streak" id="streak"></span>
  </div>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-tab="today" aria-selected="true">Today</button>
    <button class="tab" role="tab" data-tab="mistakes" aria-selected="false">Mistakes</button>
    <button class="tab" role="tab" data-tab="cards" aria-selected="false">Cards</button>
  </div>

  <div id="sample-note" class="card" hidden>
    <span class="muted">Sample entries are included so you can see how it works.</span>
    <div><button class="link" id="rm-samples" type="button">Remove samples</button></div>
  </div>

  <div class="card" id="acct"></div>

  <!-- TODAY -->
  <section id="v-today" class="view" style="display:flex;flex-direction:column;gap:18px">
    <div class="card">
      <h2>Study timer</h2>
      <div class="dur" id="dur">
        <button class="chip" data-min="25" aria-pressed="true">25 min</button>
        <button class="chip" data-min="45" aria-pressed="false">45 min</button>
        <button class="chip" data-min="60" aria-pressed="false">60 min</button>
      </div>
      <div class="timer" id="clock" aria-live="off">25:00</div>
      <div class="row" style="justify-content:center">
        <button class="btn" id="t-start" type="button">Start</button>
        <button class="btn ghost" id="t-finish" type="button" disabled>Finish and log</button>
        <button class="btn ghost" id="t-reset" type="button">Reset</button>
      </div>
      <div class="msg" id="t-msg" style="text-align:center"></div>
    </div>

    <div class="stats">
      <div class="stat"><b id="s-today">0</b><span class="muted">minutes today</span></div>
      <div class="stat"><b id="s-due">0</b><span class="muted">items due to review</span></div>
    </div>

    <div class="card">
      <h2>Last 7 days (minutes)</h2>
      <div class="bars" id="bars"></div>
    </div>

    <div class="card">
      <h2>Weakest topics</h2>
      <div id="weak"></div>
    </div>
  </section>

  <!-- MISTAKES -->
  <section id="v-mistakes" class="view" style="display:flex;flex-direction:column;gap:18px" hidden>
    <form class="card" id="m-form" autocomplete="off">
      <h2>Log a question you got wrong</h2>
      <label class="f" for="m-q">Question
        <textarea id="m-q" placeholder="Paste or type the question"></textarea>
      </label>
      <label class="f" for="m-a">Correct answer and why you missed it
        <textarea id="m-a" placeholder="Right answer, and the reason you got it wrong"></textarea>
      </label>
      <label class="f" for="m-t">Topic
        <input type="text" id="m-t" list="topics" placeholder="e.g. Pharmacology">
      </label>
      <datalist id="topics">
        <option value="Anatomy"><option value="Physiology"><option value="Biochemistry"><option value="Pathology">
        <option value="Pharmacology"><option value="Microbiology"><option value="Medicine"><option value="Surgery">
        <option value="OBG"><option value="Paediatrics"><option value="PSM"><option value="Forensic">
        <option value="ENT"><option value="Ophthalmology"><option value="Psychiatry"><option value="Radiology">
        <option value="Ethics"><option value="Emergency">
      </datalist>
      <div class="row"><button class="btn" type="submit">Save mistake</button><span class="msg" id="m-msg"></span></div>
    </form>
    <div class="row">
      <button class="btn" id="m-review" type="button">Review due</button>
      <span class="muted" id="m-count"></span>
    </div>
    <ul id="m-list"></ul>
  </section>

  <!-- CARDS -->
  <section id="v-cards" class="view" style="display:flex;flex-direction:column;gap:18px" hidden>
    <form class="card" id="c-form" autocomplete="off">
      <h2>Add flashcards</h2>
      <div class="dur" id="c-modes" style="justify-content:flex-start;flex-wrap:wrap">
        <button type="button" class="chip" data-mode="notes" aria-pressed="true">Notes</button>
        <button type="button" class="chip" data-mode="bank" aria-pressed="false">Previous year questions</button>
        <button type="button" class="chip" data-mode="csv" aria-pressed="false">Anki / CSV</button>
        <button type="button" class="chip" data-mode="single" aria-pressed="false">Single card</button>
      </div>
      <p class="muted" style="margin:0" id="c-hint"></p>
      <label class="f" for="c-tag">Source or tag (optional)
        <input type="text" id="c-tag" placeholder="e.g. FMGE 2023, Pharmacology">
      </label>
      <label class="f" for="c-notes" id="c-notes-wrap">Paste here
        <textarea id="c-notes" style="min-height:150px"></textarea>
      </label>
      <div id="c-single" hidden style="display:flex;flex-direction:column;gap:12px">
        <label class="f" for="c-front">Front
          <textarea id="c-front" placeholder="Question or term"></textarea>
        </label>
        <label class="f" for="c-back">Back
          <textarea id="c-back" placeholder="Answer or explanation"></textarea>
        </label>
      </div>
      <div class="row"><button class="btn" type="submit">Make cards</button><span class="msg" id="c-msg"></span></div>
    </form>
    <div class="row">
      <button class="btn" id="c-review" type="button">Review due</button>
      <span class="muted" id="c-count"></span>
    </div>
    <ul id="c-list"></ul>
  </section>

  <!-- REVIEW -->
  <section id="v-review" class="card" hidden>
    <div class="row" style="justify-content:space-between">
      <span class="muted" id="r-prog"></span>
      <button class="link" id="r-exit" type="button">Stop</button>
    </div>
    <div class="muted" id="r-tag"></div>
    <div class="q" id="r-front"></div>
    <div id="r-back" class="ans" hidden></div>
    <div class="row" id="r-actions"></div>
  </section>
</main>

<script>
(function () {
  var KEY = "medrecall-v1";
  var STEPS = [1, 3, 7, 14, 30, 60];
  var GOAL = 10;

  var state = load();
  var tab = "today";
  var review = null;

  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function key(d) { return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function today() { return key(new Date()); }
  function plus(days) { var d = new Date(); d.setDate(d.getDate() + days); return key(d); }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) return JSON.parse(raw);
    } catch (e) {}
    return {
      minutes: {},
      mistakes: [
        { id: uid(), sample: true, q: "Which drug is the antidote for heparin overdose?", a: "Protamine sulfate. I mixed it up with vitamin K, which reverses warfarin.", topic: "Pharmacology", box: 0, due: today() },
        { id: uid(), sample: true, q: "Which nerve is injured in a fracture of the surgical neck of the humerus?", a: "Axillary nerve.", topic: "Anatomy", box: 0, due: today() }
      ],
      cards: [
        { id: uid(), sample: true, q: "Warfarin", a: "Inhibits vitamin K epoxide reductase. Monitor with INR.", box: 0, due: today() },
        { id: uid(), sample: true, q: "Reed-Sternberg cells", a: "Seen in Hodgkin lymphoma.", box: 0, due: today() }
      ]
    };
  }
  var afterSave = function () {};
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} afterSave(); }

  function h(tag, props) {
    var e = document.createElement(tag);
    props = props || {};
    Object.keys(props).forEach(function (k) {
      var v = props[k];
      if (k === "class") e.className = v;
      else if (k === "text") e.textContent = v;
      else if (k.indexOf("on") === 0) e.addEventListener(k.slice(2), v);
      else e.setAttribute(k, v);
    });
    for (var i = 2; i < arguments.length; i++) { if (arguments[i]) e.append(arguments[i]); }
    return e;
  }
  function $(id) { return document.getElementById(id); }
  function flash(id, text) {
    var el = $(id); el.textContent = text;
    setTimeout(function () { if (el.textContent === text) el.textContent = ""; }, 2500);
  }

  /* ---------- streak and minutes ---------- */
  function streak() {
    var n = 0, d = new Date();
    if ((state.minutes[key(d)] || 0) < GOAL) d.setDate(d.getDate() - 1);
    while ((state.minutes[key(d)] || 0) >= GOAL) { n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function addMinutes(m) {
    var k = today();
    state.minutes[k] = (state.minutes[k] || 0) + m;
    save(); renderAll();
  }

  /* ---------- spaced review ---------- */
  function dueItems(list) { var t = today(); return list.filter(function (x) { return x.due <= t; }); }
  function grade(item, right) {
    if (right) { item.box = Math.min(item.box + 1, STEPS.length - 1); }
    else { item.box = 0; }
    item.due = plus(STEPS[item.box]);
  }

  /* ---------- timer ---------- */
  var dur = 25, remaining = 25 * 60, endAt = 0, running = false, tick = null, elapsedBefore = 0;
  function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return String(m).padStart(2, "0") + ":" + String(r).padStart(2, "0"); }
  function drawClock() { $("clock").textContent = fmt(Math.max(0, remaining)); document.title = running ? fmt(Math.max(0, remaining)) + " MedRecall" : "MedRecall"; }
  function studiedMinutes() { var secs = dur * 60 - remaining; return Math.floor(secs / 60); }

  function startTimer() {
    if (running) {
      remaining = Math.round((endAt - Date.now()) / 1000);
      running = false; clearInterval(tick);
      $("t-start").textContent = "Resume";
    } else {
      endAt = Date.now() + remaining * 1000;
      running = true;
      $("t-start").textContent = "Pause";
      tick = setInterval(function () {
        remaining = Math.round((endAt - Date.now()) / 1000);
        if (remaining <= 0) { remaining = 0; finish(true); return; }
        drawClock();
      }, 500);
    }
    $("t-finish").disabled = false;
    drawClock();
  }
  function finish(complete) {
    if (running) { remaining = Math.max(0, Math.round((endAt - Date.now()) / 1000)); }
    clearInterval(tick); running = false;
    var m = complete ? dur : studiedMinutes();
    if (m >= 1) { addMinutes(m); flash("t-msg", m + " min logged."); }
    else { flash("t-msg", "Under a minute, so nothing was logged."); }
    resetTimer(true);
  }
  function resetTimer(keepMsg) {
    clearInterval(tick); running = false;
    remaining = dur * 60;
    $("t-start").textContent = "Start";
    $("t-finish").disabled = true;
    if (!keepMsg) $("t-msg").textContent = "";
    drawClock();
  }
  $("t-start").addEventListener("click", startTimer);
  $("t-finish").addEventListener("click", function () { finish(false); });
  $("t-reset").addEventListener("click", function () { resetTimer(false); });
  $("dur").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (!b || running) return;
    dur = +b.getAttribute("data-min");
    document.querySelectorAll("#dur .chip").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    resetTimer(false);
  });

  /* ---------- renderers ---------- */
  function renderToday() {
    var t = today();
    $("s-today").textContent = state.minutes[t] || 0;
    $("s-due").textContent = dueItems(state.mistakes).length + dueItems(state.cards).length;

    var bars = $("bars"); bars.innerHTML = "";
    var days = [], max = 60;
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setDate(d.getDate() - i);
      var v = state.minutes[key(d)] || 0;
      if (v > max) max = v;
      days.push({ d: d, v: v, today: i === 0 });
    }
    days.forEach(function (x) {
      var bar = h("div", { "class": "bar" + (x.today ? " today" : "") },
        h("span", { text: x.v ? String(x.v) : "" }),
        h("i", { style: "height:" + Math.round((x.v / max) * 80) + "px" }),
        h("span", { text: x.d.toLocaleDateString(undefined, { weekday: "narrow" }) }));
      bars.appendChild(bar);
    });

    var counts = {};
    state.mistakes.forEach(function (m) { var k = m.topic || "Untagged"; counts[k] = (counts[k] || 0) + 1; });
    var top = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; }).slice(0, 3);
    var weak = $("weak"); weak.innerHTML = "";
    if (!top.length) weak.appendChild(h("div", { "class": "muted", text: "Log a few mistakes and your weakest topics show up here." }));
    top.forEach(function (k) {
      weak.appendChild(h("div", { "class": "row", style: "justify-content:space-between;padding:4px 0" },
        h("span", { text: k }), h("span", { "class": "muted", text: counts[k] + (counts[k] === 1 ? " mistake" : " mistakes") })));
    });
  }

  function renderList(listEl, items, kind) {
    listEl.innerHTML = "";
    if (!items.length) {
      listEl.appendChild(h("li", { "class": "empty", text: kind === "m" ? "No mistakes logged yet." : "No cards yet. Paste some notes above." }));
      return;
    }
    var t = today();
    items.slice().sort(function (a, b) { return a.due < b.due ? -1 : 1; }).forEach(function (x) {
      var isDue = x.due <= t;
      var meta = h("div", { "class": "muted" });
      var label = kind === "m" ? x.topic : x.tag;
      if (label) meta.appendChild(h("span", { "class": "tag", text: label }));
      meta.appendChild(isDue ? h("span", { "class": "due-now", text: "Due now" }) : h("span", { text: "Next review " + x.due }));
      var li = h("li", { "class": "item" },
        h("div", { "class": "body" }, h("div", { text: x.q.split("\n")[0] }), meta),
        h("button", { "class": "del", type: "button", "aria-label": "Delete", text: "×", onclick: function () {
          var arr = kind === "m" ? "mistakes" : "cards";
          state[arr] = state[arr].filter(function (y) { return y.id !== x.id; });
          save(); renderAll();
        } }));
      listEl.appendChild(li);
    });
  }

  function renderAll() {
    var s = streak();
    $("streak").textContent = s > 0 ? "🔥 " + s + (s === 1 ? " day" : " days") : "No streak yet";
    renderToday();
    renderList($("m-list"), state.mistakes, "m");
    renderList($("c-list"), state.cards, "c");
    $("m-count").textContent = dueItems(state.mistakes).length + " due of " + state.mistakes.length;
    $("c-count").textContent = dueItems(state.cards).length + " due of " + state.cards.length;
    $("m-review").disabled = dueItems(state.mistakes).length === 0;
    $("c-review").disabled = dueItems(state.cards).length === 0;
    $("acct").hidden = true;
    var hasSample = state.mistakes.concat(state.cards).some(function (x) { return x.sample; });
    $("sample-note").hidden = !hasSample || !!review;
  }

  function showTab(name) {
    tab = name;
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === name ? "true" : "false"); });
    ["today", "mistakes", "cards"].forEach(function (n) { $("v-" + n).hidden = n !== name || !!review; });
    $("tabs").hidden = !!review;
    $("v-review").hidden = !review;
    renderAll();
  }
  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest(".tab"); if (b) showTab(b.getAttribute("data-tab"));
  });

  /* ---------- forms ---------- */
  $("m-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var q = $("m-q").value.trim();
    if (!q) { $("m-q").focus(); return; }
    state.mistakes.unshift({ id: uid(), q: q, a: $("m-a").value.trim(), topic: $("m-t").value.trim(), box: 0, due: today() });
    $("m-q").value = ""; $("m-a").value = ""; $("m-t").value = "";
    save(); renderAll(); flash("m-msg", "Saved.");
  });

  function parseNotes(text) {
    var cards = [], skipped = 0, pendingQ = null;
    text.split(/\n+/).forEach(function (raw) {
      var line = raw.trim().replace(/^[-*•]\s+/, "").replace(/^\d+[.)]\s+/, "");
      if (!line) return;
      var m;
      if ((m = line.match(/^q[:.]\s*(.+)$/i))) { pendingQ = m[1]; return; }
      if ((m = line.match(/^a[:.]\s*(.+)$/i)) && pendingQ) { cards.push({ q: pendingQ, a: m[1] }); pendingQ = null; return; }
      if ((m = line.match(/^(.{2,90}?)\s*(?::|–|—|=>|->|\s-\s)\s*(.+)$/))) { cards.push({ q: m[1].trim(), a: m[2].trim() }); return; }
      skipped++;
    });
    return { cards: cards, skipped: skipped };
  }
  /* Previous year questions: blocks separated by a blank line.
     Question, options A) to E), then "Answer: B" and optional "Explanation: ...". */
  function parseBank(text) {
    var cards = [], skipped = 0;
    text.split(/\n\s*\n/).forEach(function (block) {
      var lines = block.split("\n").map(function (l) { return l.trim(); }).filter(Boolean);
      if (!lines.length) return;
      var q = [], opts = [], ans = "", exp = [], inExp = false, m;
      lines.forEach(function (l) {
        if ((m = l.match(/^(?:answer|ans|correct(?: answer)?)\s*[:\-]?\s*\(?([A-Ea-e])\)?\b(.*)$/i))) { ans = m[1].toUpperCase(); inExp = false; return; }
        if ((m = l.match(/^(?:explanation|exp|rationale|reason)\s*[:\-]\s*(.*)$/i))) { exp.push(m[1]); inExp = true; return; }
        if (inExp) { exp.push(l); return; }
        if ((m = l.match(/^\(?([A-Ea-e])[).:]\s+(.+)$/))) { opts.push({ k: m[1].toUpperCase(), t: m[2] }); return; }
        q.push(l.replace(/^(?:q(?:uestion)?\s*\d*\s*[.:)]\s*|\d+\s*[.)]\s*)/i, ""));
      });
      if (!q.length || !ans) { skipped++; return; }
      var front = q.join(" ");
      if (opts.length) front += "\n" + opts.map(function (o) { return o.k + ") " + o.t; }).join("\n");
      var right = opts.filter(function (o) { return o.k === ans; })[0];
      var back = "Answer: " + ans + (right ? ") " + right.t : "");
      if (exp.length) back += "\n\n" + exp.join(" ");
      cards.push({ q: front, a: back });
    });
    return { cards: cards, skipped: skipped };
  }

  /* Anki text export or CSV-like: front and back separated by a tab or a | symbol. */
  function parseCsv(text) {
    var cards = [], skipped = 0;
    text.split(/\n+/).forEach(function (raw) {
      var line = raw.trim(); if (!line) return;
      var parts = line.indexOf("\t") >= 0 ? line.split("\t") : line.split("|");
      if (parts.length < 2 || !parts[0].trim() || !parts[1].trim()) { skipped++; return; }
      cards.push({ q: parts[0].trim(), a: parts.slice(1).join(" ").trim() });
    });
    return { cards: cards, skipped: skipped };
  }

  var cmode = "notes";
  var HINTS = {
    notes: "One card per line: term: meaning, or term - meaning. Q: and A: lines also work.",
    bank: "Paste previous year questions. Leave a blank line between questions. Write the question, then options A) to D), then Answer: B and, if you have it, Explanation: ...",
    csv: "One card per line, with the front and back separated by a tab or a | symbol. Anki text exports work.",
    single: "Type one card by hand."
  };
  var HOLD = {
    notes: "Warfarin: inhibits vitamin K epoxide reductase\nHeparin antidote - protamine sulfate",
    bank: "1. Antidote for heparin overdose is:\nA) Vitamin K\nB) Protamine sulfate\nC) Naloxone\nD) Flumazenil\nAnswer: B\nExplanation: Protamine binds heparin.",
    csv: "Reed-Sternberg cells | Hodgkin lymphoma",
    single: ""
  };
  function setMode(m) {
    cmode = m;
    document.querySelectorAll("#c-modes .chip").forEach(function (x) { x.setAttribute("aria-pressed", x.getAttribute("data-mode") === m ? "true" : "false"); });
    $("c-hint").textContent = HINTS[m];
    $("c-notes").placeholder = HOLD[m];
    $("c-notes-wrap").hidden = m === "single";
    $("c-single").hidden = m !== "single";
  }
  $("c-modes").addEventListener("click", function (e) {
    var b = e.target.closest(".chip"); if (b) setMode(b.getAttribute("data-mode"));
  });
  setMode("notes");

  $("c-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var r;
    if (cmode === "single") {
      var f = $("c-front").value.trim(), b = $("c-back").value.trim();
      if (!f || !b) { flash("c-msg", "Fill in both the front and the back."); return; }
      r = { cards: [{ q: f, a: b }], skipped: 0 };
    } else {
      var text = $("c-notes").value;
      r = cmode === "bank" ? parseBank(text) : cmode === "csv" ? parseCsv(text) : parseNotes(text);
    }
    if (!r.cards.length) { flash("c-msg", "No cards found. Check the format above."); return; }
    var tag = $("c-tag").value.trim();
    r.cards.reverse().forEach(function (c) { state.cards.unshift({ id: uid(), q: c.q, a: c.a, tag: tag, box: 0, due: today() }); });
    $("c-notes").value = ""; $("c-front").value = ""; $("c-back").value = "";
    save(); renderAll();
    flash("c-msg", r.cards.length + (r.cards.length === 1 ? " card made" : " cards made") + (r.skipped ? ", " + r.skipped + " skipped." : "."));
  });

  $("rm-samples").addEventListener("click", function () {
    state.mistakes = state.mistakes.filter(function (x) { return !x.sample; });
    state.cards = state.cards.filter(function (x) { return !x.sample; });
    save(); renderAll();
  });

  /* ---------- review ---------- */
  function startReview(kind) {
    var list = dueItems(kind === "m" ? state.mistakes : state.cards);
    if (!list.length) return;
    review = { kind: kind, queue: list.slice(), done: 0, total: list.length, shown: false };
    showTab(tab); drawReview();
  }
  function drawReview() {
    var r = review;
    if (!r || !r.queue.length) { review = null; showTab(tab); return; }
    var item = r.queue[0];
    $("r-prog").textContent = (r.done + 1) + " of " + r.total;
    $("r-tag").textContent = item.tag || item.topic || "";
    $("r-front").textContent = item.q;
    var back = $("r-back"), actions = $("r-actions");
    actions.innerHTML = "";
    if (!r.shown) {
      back.hidden = true;
      actions.appendChild(h("button", { "class": "btn", type: "button", text: "Show answer", onclick: function () { r.shown = true; drawReview(); } }));
    } else {
      back.hidden = false;
      back.textContent = item.a || "(No answer saved)";
      actions.appendChild(h("button", { "class": "btn bad", type: "button", text: "Missed it", onclick: function () { answer(false); } }));
      actions.appendChild(h("button", { "class": "btn good", type: "button", text: "Got it", onclick: function () { answer(true); } }));
    }
  }
  function answer(right) {
    var r = review, item = r.queue.shift();
    grade(item, right);
    r.done++; r.shown = false;
    save();
    drawReview();
  }
  $("m-review").addEventListener("click", function () { startReview("m"); });
  $("c-review").addEventListener("click", function () { startReview("c"); });
  $("r-exit").addEventListener("click", function () { review = null; showTab(tab); });

  /* ---------- accounts and sync ---------- */
  var TOKEN_KEY = "medrecall-token";
  var token = null;
  try { token = localStorage.getItem(TOKEN_KEY); } catch (e) {}
  var me = null, pushTimer = null, syncText = "";

  function api(path, opts) {
    opts = opts || {};
    opts.headers = { "Content-Type": "application/json" };
    if (token) opts.headers.Authorization = "Bearer " + token;
    return fetch(path, opts).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var err = new Error(j.error || "Request failed"); err.status = r.status; throw err; }
        return j;
      });
    });
  }

  function merge(a, b) {
    var out = { minutes: {}, mistakes: [], cards: [] };
    [a.minutes || {}, b.minutes || {}].forEach(function (m) {
      Object.keys(m).forEach(function (k) { out.minutes[k] = Math.max(out.minutes[k] || 0, m[k]); });
    });
    ["mistakes", "cards"].forEach(function (n) {
      var seen = {};
      (a[n] || []).concat(b[n] || []).forEach(function (x) { if (!seen[x.id]) { seen[x.id] = 1; out[n].push(x); } });
    });
    return out;
  }

  function setSync(text) { syncText = text; var el = $("sync-msg"); if (el) el.textContent = text; }

  function push() {
    if (!token) return;
    setSync("Saving...");
    api("/api/state", { method: "PUT", body: JSON.stringify({ data: state }) })
      .then(function () { setSync("Synced"); })
      .catch(function (e) {
        if (e.status === 401) { signOut(); }
        else if (e.status === 402) { setSync("Free limit reached (" + (me ? me.limits.mistakes : 30) + " mistakes, " + (me ? me.limits.cards : 60) + " cards). Upgrade to keep syncing."); }
        else { setSync("Could not sync. Your data is still saved on this device."); }
      });
  }
  afterSave = function () {
    if (!token) return;
    clearTimeout(pushTimer);
    pushTimer = setTimeout(push, 1200);
  };

  function signOut() {
    token = null; me = null;
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
    setSync(""); renderAcct();
  }

  function authenticate(mode) {
    var email = $("a-email").value.trim(), pw = $("a-pw").value;
    if (!email || !pw) { setSync("Enter your email and password."); return; }
    setSync("Please wait...");
    api("/api/" + mode, { method: "POST", body: JSON.stringify({ email: email, password: pw }) })
      .then(function (r) {
        token = r.token;
        try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
        boot();
      })
      .catch(function (e) { setSync(e.message); });
  }

  function boot() {
    if (!token) { renderAcct(); return; }
    api("/api/me")
      .then(function (m) { me = m; return api("/api/state"); })
      .then(function (r) {
        if (r.data) { state = merge(state, r.data); }
        save();            /* writes locally and pushes the merged copy */
        renderAcct(); renderAll();
        if (/[?&]upgraded=1/.test(location.search)) { history.replaceState(null, "", location.pathname); setSync("Thanks. Your Pro plan is being activated."); }
      })
      .catch(function (e) { if (e.status === 401) signOut(); else { renderAcct(); setSync("Offline. Your data is saved on this device."); } });
  }

  function go(path) {
    api(path, { method: "POST" }).then(function (r) { location.href = r.url; }).catch(function (e) { setSync(e.message); });
  }

  function renderAcct() {
    var box = $("acct"); box.innerHTML = "";
    if (!token || !me) {
      box.appendChild(h("h2", { text: "Back up and sync" }));
      box.appendChild(h("div", { "class": "muted", text: "Create a free account to keep your data safe and use it on your phone and laptop." }));
      box.appendChild(h("input", { type: "email", id: "a-email", placeholder: "Email", autocomplete: "email", "aria-label": "Email" }));
      box.appendChild(h("input", { type: "password", id: "a-pw", placeholder: "Password (8+ characters)", autocomplete: "current-password", "aria-label": "Password" }));
      box.appendChild(h("div", { "class": "row" },
        h("button", { "class": "btn", type: "button", text: "Create account", onclick: function () { authenticate("register"); } }),
        h("button", { "class": "btn ghost", type: "button", text: "Sign in", onclick: function () { authenticate("login"); } })));
    } else {
      box.appendChild(h("div", { "class": "row", style: "justify-content:space-between" },
        h("span", { text: me.email }),
        h("span", { "class": "tag", text: me.pro ? "Pro" : "Free" })));
      var btns = h("div", { "class": "row" });
      if (!me.pro && me.billing) btns.appendChild(h("button", { "class": "btn", type: "button", text: "Upgrade to Pro", onclick: function () { go("/api/billing/checkout"); } }));
      if (me.pro) btns.appendChild(h("button", { "class": "btn ghost", type: "button", text: "Manage plan", onclick: function () { go("/api/billing/portal"); } }));
      btns.appendChild(h("button", { "class": "btn ghost", type: "button", text: "Sign out", onclick: signOut }));
      box.appendChild(btns);
      if (!me.pro) box.appendChild(h("div", { "class": "muted", text: "Free plan: up to " + me.limits.mistakes + " mistakes and " + me.limits.cards + " cards synced." }));
    }
    box.appendChild(h("div", { "class": "msg", id: "sync-msg", text: syncText }));
  }


  resetTimer(false);
  showTab("today");
})();
</script>
</body>
